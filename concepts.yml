context: reviews
name: Reviews
intro: >-
  The common reviews vocabulary -- the reviews customers write, the replies businesses post,
  the business locations being reviewed and the review requests that ask for them --
  distilled from the APIs that already exist.
tags: [Reviews, Ratings, Reputation Management, Customer Reviews, Online Reviews, Review Management, User-Generated Content]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url]

common_fields:
  id: [uuid, guid, object_id, record_id, review_id, external_id]
  created_at: [created, created_date, date_created, create_time, creation_date, created_on, published_at, review_date, date, time]
  updated_at: [updated, updated_date, modified_at, last_modified, date_modified, update_time, modified_date, modified]
  metadata: [meta_data, custom_fields, custom, attributes, properties, tags]
  status: [state, moderation_status, review_status, published, is_published]
  name: [title, display_name, label]

concepts:
  review:
    segments: [reviews, review, ratings@products|reviews|locations, testimonials, feedback@products|reviews]
    aliases:
      rating: [stars, score, star_rating, overall_rating, rating_value, value]
      body: [text, content, comment, review_text, review_body, message, description]
      title: [headline, summary, subject]
      author_name: [reviewer, reviewer_name, author, customer_name, nickname, display_name_author, user]
      source: [platform, site, channel, provider, origin]
      product_id: [product, sku, item_id, product_sku]
      location_id: [location, business_id, business, place_id, store_id]
      verified: [is_verified, verified_buyer, verified_purchase]
      language: [lang, locale, language_code]
  review_reply:
    requires: [review]
    path: /reviews/{review_id}/replies
    segments: ["replies@reviews|review", "reply@reviews|review", "responses@reviews|review", "comments@reviews|review"]
    aliases:
      body: [text, content, comment, reply, message]
      author_name: [author, user, responder]
  reviewed_location:
    requires: [review]
    path: /review-locations
    segments: [locations, location, businesses, business, listings@reviews|reputation]
    aliases:
      average_rating: [rating, avg_rating, average_score, overall_rating, stars]
      review_count: [reviews_count, total_reviews, num_reviews, rating_count]
      address: [street_address, address_line1]
  # review_request was measured and dropped: 1 provider.

findings:
  - "A review agrees on rating, body, author, id and created_at across reputation platforms,
    product-review tools and listing networks: the review is one of the most uniform
    user-generated resources in the commons."
  - "A reply agrees on its body; the author and timestamps are carried by too few to share."
  - "A reviewed location agrees on name, address, city, phone and description."
decisions:
  - "Ratings and feedback count as reviews only beneath products, reviews or locations; bare
    `/ratings` is a credit or app rating elsewhere."
  - "Replies cover responses and comments beneath a review."
  - "Review locations are `/review-locations`: `/locations` is a store, a work site or a
    restaurant in other contexts."
  - "Review requests were measured and dropped (1 provider)."
